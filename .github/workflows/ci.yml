name: ci

on:
  push:
    # `main` is the default branch; the parity phases land on `phase-*` branches first, and a push to
    # one of those has to run the gate too — otherwise the only check is the PR, and a direct push
    # would go unverified.
    branches: [main, "phase-*"]
  pull_request:

# Every step below is also a local `npm run …`, so a green CI run never proves something the
# developer could not have run themselves.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `/api/health` echoes this, so a running deploy can be identified from the outside.
  GIT_SHA: ${{ github.sha }}

# Every job pins the LTS image rather than `ubuntu-latest`. `latest` follows a pre-release during a
# cycle, and its archive mirror is slow enough that `playwright install --with-deps` alone — before a
# single test runs — spent the whole e2e budget fetching libavcodec and friends. The image a gate runs
# on is part of the gate: a pinned one either works or fails the same way twice.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Built as production, on the real origin, so the crawl below is checking the site a reader would
    # get rather than a laptop: a canonical that still says `localhost` fails `origin:check` here.
    env:
      SITE_ENV: production
      SITE_URL: https://excelsupreme.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The unit suite, including the golden snapshot that pins every grader verdict.
      - name: unit
        run: npm test

      # Static checks. Existing findings are warnings; only new errors fail.
      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # Fixtures are replayed through the real grader here, not just shape-checked: a lesson whose
      # declared rejects are actually accepted is a broken drill that only this step catches.
      - name: content factory gate
        run: npm run content:check

      # The notes gate: every function page has its seven sections, its drills exist, and the prose
      # reads like a person wrote it. Separate from the factory gate because it fails on different work.
      - name: function notes gate
        run: npm run content:articles

      # The problem pages gate: every problem page has its four sections, a drill that exists, one
      # link to a note and two to its neighbours, and prose a person would read to the end.
      - name: problem pages gate
        run: npm run content:formulas

      # The snapshot is recorded, never regenerated in CI: `npm run golden:update` is a deliberate
      # local action, so an updated snapshot has to arrive as a reviewable diff. `status --porcelain`
      # rather than `diff` so a newly added snapshot file counts as a change too.
      - name: golden snapshot is unchanged
        run: test -z "$(git status --porcelain -- tests/golden)"

      # `next:build` runs the legacy build first, so the crawl below reads output written a second
      # ago rather than a stale `legacy/dist` (or nothing at all on a fresh checkout).
      - name: next build
        run: npm run next:build

      - name: crawl the emitted static site
        run: node legacy/src/verify.mjs

      # The lesson page's JavaScript and the route's first-party weight, both against a budget with the
      # baseline recorded. The printer names the largest files when it fails.
      - name: byte budget
        run: npm run budget

      - name: routes match the templates
        run: npm run next:check

      # No absolute URL may sit on the fallback origin once the build says production.
      - name: every URL is on the shipped origin
        run: npm run origin:check

      # A service key or a Stripe secret in `legacy/dist` or `.next` is a leak the moment the artifact
      # is served, and no other step looks inside the emitted files for one.
      - name: no secret in the build output
        run: npm run secret:check

      # `/api/health` is prerendered, so it reports the commit the artifact was *built* from — which is
      # exactly the identity a deploy should carry, and it fails loudly ("unknown") if the env is missed.
      - name: the built app reports its commit
        run: |
          set -euo pipefail
          health="${RUNNER_TEMP:-/tmp}/health.json"
          npx next start -p 4174 &
          server=$!
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4174/api/health > "$health" && break
            sleep 0.5
          done
          HEALTH_FILE="$health" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync(process.env.HEALTH_FILE, "utf8"));
            const expected = process.env.GIT_SHA;
            if (health.status !== "ok") throw new Error(`health: ${JSON.stringify(health)}`);
            if (health.sha !== expected) throw new Error(`expected sha ${expected}, got ${health.sha}`);
          '
          kill "$server"

  e2e:
    runs-on: ubuntu-24.04
    # Three engines: the drill and the keyboard specs run on Firefox and WebKit as well as Chromium.
    # The browser and system dependencies are the bulk of this job's variance, so the budget leaves
    # room for the install after a cold runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # `playwright.config.js` starts both servers itself — `next start` on 4174 and the static file
      # server over `legacy/dist` on 4175 — so only the build has to happen here.
      - name: build
        run: npm run next:build

      - name: e2e
        run: npx playwright test

      # Accessibility, best practices and SEO are errors; performance is a warning on a shared runner.
      # The five routes are the ones a reader meets first: home, the price, a free drill, a note, the dashboard.
      - name: lighthouse
        run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    # The one layer no other gate reaches: row level security, the GoTrue triggers and the SQL
    # functions. It needs Docker, a real stack and a reset, so it is its own job rather than a step in
    # `check` — and it runs the accounts browser suite too, because those specs are the only place a
    # session, an entitlement and a certificate are proved together.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `tests/db/harness.mjs` shells out to `psql`, and the images do not guarantee the client.
      - name: postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Pinned, not `latest`. CLI 3.0.0 landed on 2 November and renamed `[inbucket]` to
      # `[local_smtp]` in `supabase/config.toml`, so `latest` turned every run red on a config this
      # repo has not migrated yet. The pin comes off with that migration, together with an upgrade of
      # the version `npm run db:start` uses locally, which is still on the 2.x line.
      - uses: supabase/setup-cli@v1
        with:
          version: "2.122.1"

      - name: start the stack
        run: supabase start

      - name: the database suite
        run: npm run db:check

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: build
        run: npm run next:build

      - name: the accounts browser suite
        run: npm run e2e:accounts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: accounts-report
          path: playwright-report/
          retention-days: 7

  static:
    # The static site keeps deploying on its own until phase 9 replaces it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: build and crawl the static site
        run: npm run verify

      - name: vendored assets are unmodified
        run: npm run vendor:check

      - name: no secret in the static build
        run: npm run secret:check
