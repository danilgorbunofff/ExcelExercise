# Vale reads the Markdown pages and the Markdown that scripts/vale-sync.mjs exports from the JSON lessons.
# The style is generated from packages/content-lint/data/copy-rules.json; run `npm run vale`.
# Spelling is left off on purpose: a formula lesson is full of function names Vale would flag.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = ExcelSupreme
